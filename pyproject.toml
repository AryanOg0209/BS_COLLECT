[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collectos"
version = "0.1.0"
description = "Receivables follow-up and ageing toolkit for Indian B2B SMEs (local-first)."
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "segno>=1.6"]

[project.scripts]
collectos = "collectos.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ai = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collectos = ["webui/*", "site/*", "site/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
